[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kodo-lang"
version = "0.1.0"
description = "Kodo - bahasa pemrograman pembuat aplikasi (.kd), ditulis dengan Python"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "DoctorRIDX" }]

[project.scripts]
kodo = "kodo.cli:main"

[tool.setuptools]
packages = ["kodo"]
